[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "leadharbour"
version = "0.1.0"
description = "A small, reviewable predictive outreach learning scaffold"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Jhony Vidal"}]
dependencies = [
  "fastapi>=0.115,<1",
  "joblib>=1.4,<2",
  "pandas>=2.2,<4",
  "pydantic>=2.9,<3",
  "scikit-learn>=1.6,<2",
  "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
agent = ["google-adk>=2.5,<3", "google-genai>=2.9,<3"]
local-agent = ["google-adk>=2.5,<3", "litellm>=1.84,<2"]
comparison = ["xgboost>=3,<4"]
test = ["pytest>=8,<10", "httpx>=0.27,<1", "coverage>=7,<8", "xgboost>=3,<4"]
notebook = ["jupyterlab>=4,<5", "matplotlib>=3.9,<4", "xgboost>=3,<4"]

[project.scripts]
leadharbour = "leadharbour.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]

[tool.coverage.run]
branch = true
source = ["leadharbour"]

[tool.coverage.report]
show_missing = true
